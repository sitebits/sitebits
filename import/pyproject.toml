[project]
name = "scanview-import"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pye57>=0.4",
    "numpy>=1.26",
    "Pillow>=10",
    "laspy[lazrs]>=2.5",
    "scipy>=1.18.1",
    "pygltflib==1.16.5",
    "meshoptimizer==0.2.30a0",
    "pyproj>=3.7",
]

[project.scripts]
scanview-import = "scanview_import.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanview_import"]
dev-mode-dirs = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
extend-select = ["BLE", "C90", "ASYNC"]
ignore = ["RUF005"]  # Collection-Literal-Autofix bricht NumPy-Broadcasting

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
pythonpath = ["tests", "tests/spike", "scripts"]
markers = ["data: braucht echte Pilotdaten (nicht in CI)", "docker: braucht Docker + pdal/pdal"]
# importlib statt prepend (Default): tests/spike/ und scripts/spike/ heißen beide "spike"
# (Tests importieren Produktivcode als spike.source_mesh/spike.tiles_contract).
# Im Default-Modus "prepend" kollidieren beide Verzeichnisse als ein einziges Top-Level-Paket
# "spike" auf sys.path (abhängig von der Reihenfolge gewinnt eines, das andere wird unsichtbar);
# "importlib" adressiert Testmodule über ihren Dateipfad statt über die __init__.py-Paketkette
# und löst die Namensgleichheit auf. pythonpath (sys.path-Einträge für tests/scripts) bleibt
# davon unberührt — from e57_fixture import … & Co. funktionieren unverändert.
addopts = "--import-mode=importlib"

[tool.ruff.lint.mccabe]
max-complexity = 15
