impact_statement = "Verspätete Billion-Laughs-Erkennung in accountingDiffTolerated() (lib/xmlparse.c). Erreichbar ist sie mit jedem XML_Parse eines Dokuments mit DTD. Die Symbolprüfung allein schließt das deshalb nicht aus: In der Hülle = ldd von bin/pdal, bin/untwine und lib/libpdal_plugin_*.so der installierten Umgebung (70 ELF-Dateien), Importe per nm -D --undefined-only, 10.11.2026 importieren libgdal, libkmlbase und libfreexl XML_Parse. pdal, untwine, libpdalcpp und die PDAL-Plugins importieren kein XML_*-Symbol. libexpat, libkml* und libfreexl kommen nur über libgdal in den Prozess (readelf DT_NEEDED: libgdal → libexpat, libkmlbase/libkmldom/libkmlengine und libspatialite → libfreexl; libexpat steht sonst nur bei libkmlbase, libkmldom und libfreexl); lib/gdalplugins enthält nur drivers.ini. Was trägt: (1) In der GDAL-Quelle 3.13.3 (die Binärdatei enthält den String „GDAL 3.13.3“) steht XML_Parse nur in OGR-Vektortreibern (georss, gml, gpx, jml, kml, lvbag, ods, osm, xlsx); libkml wird nur vom Treiber LIBKML aufgerufen (ogr/ogrsf_frmts/libkml). Nur libspatialite bindet freexl ein (libgdal importiert kein freexl_*), und GDAL bindet libspatialite nur im SQLite-Treiber ein (spatialite_init_ex/spatialite_alloc_connection nur in ogr/ogrsf_frmts/sqlite/ogrsqlitedatasource.cpp). Einen XLS-Treiber hat dieses libgdal nicht (ogrinfo --formats: XLSX und ODS, kein XLS; kein RegisterOGRXLS). (2) In libpdalcpp 2.10.2 (objdump -d, 10.11.2026) rufen nur pdal::gdal::Raster::open und pdal::gdal::getPolygons GDALOpenEx auf, nur OverlayFilter::ready, TIndexReader::initialize und TIndexKernel::openDataset OGROpen und nur pdal::OGR::createLayer OGR_Dr_Open. Keine dieser Stellen gehört zu den festen Stufen readers.e57/las/text/ply/pts, filters.assign/transformation/voxelcenternearestneighbor/ferry/expression und writers.las/copc. COPC-Uploads laufen über readers.las (point_source.py). (3) CRS-Zeichenketten aus Datei oder Sidecar (override_srs, a_srs) gehen über SpatialRef an OSRSetFromUserInput. Laut GDAL-Quelle (ogrspatialreference.cpp Z. 4388/4416) öffnet das Dateien nur per VSIFOpenL, und importFromXML parst mit GDALs eigenem Minixml statt mit expat. (4) gdb mit Haltepunkten auf XML_ParserCreate, XML_ParserCreate_MM, XML_ParserCreateNS, XML_Parse und XML_ParseBuffer: Die festen Pipelines (text→transformation→assign→voxel→ferry→writers.las, readers.las→writers.copc, readers.e57/ply mit und ohne --stream, readers.pts, override_srs als Pfad auf eine XML-Datei mit DTD) und untwine erzeugen 0 Treffer. Die Positivkontrolle filters.overlay mit KML-Datei trifft (kmlbase::ExpatParser über OGRLIBKMLDriverOpen). Upstream behoben in R_2_10_0 (c30145b, PR #1433); conda-forge führt am 10.11.2026 nur 2.9.0."
zeit = 2026-11-10T10:52:04Z
pruefer = "Claude (Release 0.12.3, Master-Session; je Gruppe zwei unabhängige Prüfer)"

