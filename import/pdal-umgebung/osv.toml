# OSV-Ersatzprüfung der PDAL-Umgebung (pdal_scan, scanview-nachweise db-aktualisieren).
# Gebunden an den SHA-256 von pixi.lock: ein neues Lock macht die Datei ungültig (Neuerhebung).
# Je Paket Upstream-Repo (OSV-Ökosystem GIT), Release-Tag (kein rc) und Commit, dazu eine
# Gegenprobe: älterer Release-Tag desselben Repos mit einem Eintrag, den OSV am 05.11.2026 per
# Commit UND per Tag gemeldet hat. Bleibt die Gegenprobe leer, gilt das Paket als blind.
# Erhoben am 05.11.2026 mit git ls-remote (Tags/Commits) und api.osv.dev/v1/query.
# Nicht hier: Pakete, deren Repo OSV nicht führt, ohne Repo, oder ohne Gegenprobe auf beiden
# Wegen (zstd: v1.3.7 nur per Commit, v1.4.9 nur per Tag) — sie stehen in scan-blind.toml.
