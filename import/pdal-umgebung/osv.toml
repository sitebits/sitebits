[[vex]]
schwachstelle = "OSV-2026-343"
paket = "pcre2"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact_statement = "Absturz in pcre2_compile_32 (Bibliothek libpcre2-32, 32-Bit-Codeeinheiten). In der Hülle = ldd von bin/pdal, bin/untwine und lib/libpdal_plugin_*.so der installierten Umgebung (70 ELF-Dateien), Importe per nm -D --undefined-only, 05.11.2026 steht nur libpcre2-8.so.0; einziger Importeur ist libgdal, und zwar nur 8-Bit-Symbole (pcre2_compile_8, pcre2_jit_compile_8, pcre2_match_8 u. a.); libpcre2-32 lädt kein Programm, das siteBits startet (pdal_runner startet nur bin/pdal und bin/untwine). Ergänzender Beleg: GHSA-fmgr-6ggq-9859 (CVE-2026-89158, Advisory im Repo PCRE2Project/pcre2, veröffentlicht 31.08.2026) beschreibt einen Überlauf allein in pcre2_compile_32() und nennt die 8- und 16-Bit-Bibliothek nicht betroffen. Dass OSV-2026-343 (OSS-Fuzz, 03.03.2026) derselbe Fehler ist, ist inhaltlich wahrscheinlich (gleiche Funktion, gleiche Fehlerklasse, von OSS-Fuzz gefunden), aber nicht bewiesen: Die GHSA nennt einen anderen OSS-Fuzz-Testfall und gibt 10.48 als behoben an, während OSV 10.48 und 10.49 noch als betroffen führt. Die Aussage stützt sich deshalb auf die Symbolprüfung, nicht auf die GHSA."
zeit = 2026-11-05T06:10:15Z
pruefer = "Claude (P04 Teil 1, im Auftrag der Master-Session)"

