paket = "krb5"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact_statement = "NULL-Zeiger-Dereferenz in make_cred_list() (static in src/lib/krb5/krb/rd_cred.c, nur über krb5_rd_cred erreichbar; Fix-Commits 48afa9ab/62196e2b, behoben in 1.22.3). Laut Advisory ausgelöst durch weitergeleitete Credentials an einen GSS-API-Acceptor (gss_accept_sec_context). Kein ELF der Hülle = ldd von bin/pdal, bin/untwine und lib/libpdal_plugin_*.so der installierten Umgebung (70 ELF-Dateien), Importe per nm -D --undefined-only, 10.11.2026 importiert gss_accept_sec_context; krb5_rd_cred importiert in der Hülle nur libgssapi_krb5, und dort ruft es allein kg_accept_krb5 (objdump), also der Acceptor-Pfad (kg_accept_krb5 wird nur aus krb5_gss_accept_sec_context_ext angesprungen, und das rufen nur krb5_gss_accept_sec_context und iakerb_gss_accept_sec_context auf; erreichbar über gss_accept_sec_context sowie die SPNEGO-/NegoEx-Acceptoren). In libkrb5 selbst gibt es keinen internen Aufruf von krb5_rd_cred. Einziger Nutzer von GSS-API in der Hülle ist libcurl, und zwar nur clientseitig (gss_init_sec_context, gss_acquire_cred u. a., kein Accept). Die übrigen Importeure von gss_accept_sec_context in der Umgebung (sbin/gss-server, lib/libgssrpc) gehören nicht zur Hülle; pdal_runner startet nur bin/pdal und bin/untwine. Die Aussage beruht auf dieser Symbolprüfung, nicht auf der Netzisolation des Workers."
zeit = 2026-11-10T10:52:04Z
pruefer = "Claude (Release 0.12.3, Master-Session; je Gruppe zwei unabhängige Prüfer)"

