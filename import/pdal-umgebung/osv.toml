[[vex]]
schwachstelle = "OSV-2022-608"
paket = "libjxl"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact_statement = "Heap-use-after-free in jxl::WriteToPixelCallbackStage::ProcessRow. Das ist die Renderpipeline des Decoders (LowMemoryRenderPipeline::RenderRect/ProcessBuffers, OSS-Fuzz 49277). OSV verzeichnet kein Fix-Ereignis und führt v0.12.0 als betroffen. Der Code ist geladen, wird aber nie ausgeführt, deshalb gilt nicht vulnerable_code_not_present. libjxl.so.0.12.0 liegt in der Hülle (ldd von bin/pdal, bin/untwine und lib/libpdal_plugin_*.so der installierten Umgebung, 70 ELF-Dateien, Importe per nm -D --undefined-only, 10.11.2026). Einziger Importeur ist libgdal mit 58 Jxl*-Importen aus libjxl/libjxl_threads, darunter JxlDecoderCreate und JxlDecoderProcessInput. Laut Quelle (GDAL v3.13.3) und installierter Binärdatei (objdump -d -C) rufen nur zwei Stellen den Decoder auf: der Treiber JPEGXL (JPEGXLDataset::Identify/Open/GetDecodedImage/ReadCompressedData, frmts/jpegxl/jpegxl.cpp) und der JXL-Codec der GDAL-internen libtiff (JXLPreDecode, frmts/gtiff/tif_jxl.c). Beide laufen erst, wenn GDAL einen Rasterdatensatz öffnet. In der Hülle importiert nur libpdalcpp GDAL-Symbole. Dort rufen nur pdal::gdal::Raster::open und pdal::gdal::getPolygons GDALOpenEx auf (objdump, 10.11.2026). Raster::open wird aufgerufen von readers.gdal, filters.colorization, colorinterp, dem und hag_dem, writers.gdal und raster sowie math::writeMatrix. getPolygons öffnet nur mit GDAL_OF_VECTOR und dient OGRSpec (filters.crop/geomdistance, readers.copc/ept/stac/tindex). Keine dieser Stufen erzeugt siteBits: pdal_runner und point_source.detect_format kennen nur readers.e57/las/text/ply/pts, filters.assign/transformation/voxelcenternearestneighbor/ferry/expression, writers.las/copc und untwine. SRS-Angaben aus override_srs/a_srs und LAS-VLRs laufen über OGRSpatialReference::SetFromUserInput. Dessen Dateizweig liest in GDAL 3.13.3 nur Text (VSIFOpenL Z. 4388, VSIFReadL, dann WKT/PROJ/XML) und öffnet keinen Datensatz. Gegenprobe zur Laufzeit (gdb, Haltepunkte auf JxlDecoderCreate, JxlDecoderProcessInput und GDALOpenEx, Umgebung wie im Runner): Für diese Testeingaben gab es keinen Treffer, nämlich LAS mit SRS-VLR, LAZ, COPC, PLY, CSV, PTS und E57, jeweils durch alle fünf Filter nach writers.las, dazu writers.copc und untwine. Die Positivkontrolle (readers.gdal auf ein GeoTIFF mit COMPRESS=JXL) trifft JxlDecoderCreate über JXLPreDecode und gdal_TIFFStartStrip."
zeit = 2026-11-10T10:52:04Z
pruefer = "Claude (Release 0.12.3, Master-Session; je Gruppe zwei unabhängige Prüfer)"

