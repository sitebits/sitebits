[[vex]]
schwachstelle = "CVE-2026-124317"
paket = "libexpat"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact_statement = "Lesezugriff außerhalb des Puffers in unknown_toUtf8()/unknown_toUtf16() (lib/xmltok.c, 2.9.0 Z. 1274/1304), nur bei einer von der Anwendung registrierten unbekannten Kodierung mit Mehrbyte-Folgen und convert-Callback. Grund 1: In den festen Stufen läuft überhaupt kein expat-Parse. Belegt ist das wie bei CVE-2026-115506: XML_Parse steht nur in GDAL-OGR-Vektortreibern sowie in libkml und freexl, libpdalcpp öffnet in den festen Stufen keinen GDAL/OGR-Datensatz, und die gdb-Läufe der festen Pipelines und von untwine ergeben 0 Treffer. Grund 2: Auch wo ein GDAL-Treiber parst, ist der fehlerhafte Zweig nicht erreichbar. In der Hülle = ldd von bin/pdal, bin/untwine und lib/libpdal_plugin_*.so der installierten Umgebung (70 ELF-Dateien), Importe per nm -D --undefined-only, 10.11.2026 importiert nur libgdal XML_SetUnknownEncodingHandler; libkmlbase und libfreexl registrieren keinen Handler. Der einzige Handler, OGRExpatUnknownEncodingHandler (GDAL 3.13.3 ogr/ogr_expat.cpp, String „Unhandled encoding %s“ in libgdal vorhanden), kennt nur WINDOWS-1252 und ISO-8859-15. Er setzt ausschließlich Einbyte-Werte (Codepunkt oder -1) und convert = nullptr. expat 2.9.0 lehnt Mehrbyte-Einträge ohne Konverter ab (XmlInitUnknownEncoding, xmltok.c Z. 1345–1347). Der fehlerhafte Zweig (utf8[0] == 0 bzw. utf16 == 0, Aufruf von convert) entsteht nur für Mehrbyte-Einträge. Fix 3f83976 (PR #1492, 07.11.2026) steht in keinem Release-Tag; conda-forge führt am 10.11.2026 nur 2.9.0."
zeit = 2026-11-10T10:52:04Z
pruefer = "Claude (Release 0.12.3, Master-Session; je Gruppe zwei unabhängige Prüfer)"

