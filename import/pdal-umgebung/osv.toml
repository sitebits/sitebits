impact_statement = "OSS-Fuzz 43419: Null-Dereferenz in session_startup über libssh2_session_handshake, gefunden mit ssh2_client_fuzzer. Das ist der einzige Fuzzer von libssh2 (tests/ossfuzz in libssh2-1.11.1); er schreibt die Eingabe als Serverdaten in ein socketpair und ruft libssh2_session_handshake. Der Absturz entsteht also nur durch Daten des Servers. OSV-Bereich: introduced 64a555d (in 1.11.1 enthalten, compare: ahead), fixed b89858b (nicht in 1.11.1, compare: behind). Einziger libssh2-Importeur in der Hülle = ldd von bin/pdal, bin/untwine und lib/libpdal_plugin_*.so der installierten Umgebung (70 ELF-Dateien; lib/gdalplugins ohne Plugins), Importe per nm -D --undefined-only, 10.11.2026 ist libcurl (libssh2_session_handshake). Erreichbar ist die Stelle nur in einer SSH-Client-Sitzung über scp:// oder sftp://. Ein Weg von der Eingabedatei zu einer solchen URL (GDAL /vsicurl/) ist nicht ausgeschlossen, deshalb nicht vulnerable_code_not_in_execute_path. Abschirmung, gültig für den Import-Worker auf dem Server (scanview-import-worker, von einrichten.sh mit SCANVIEW_IMPORT=1 eingerichtet; der am Arbeitsplatz laufen dieselben Builds im Image scanview-pdal (Gleichheit per test_image_lock_gleiche_builds_wie_pdal_umgebung), dort abgeschirmt durch docker run --network none, gemessen nur lo; diese VEX-Aussage ist formal an pixi.lock gebunden und gibt den Image-Inhalt nicht frei, siehe B-SCAN-IMG-PDAL): Auftrags-Unit laeufer.py:208 (PrivateNetwork=yes), :211 (nur AF_INET/AF_INET6) und :216 (PrivatePIDs=yes). Erzwungen statt angenommen, beim Start und je Auftrag: Der Worker startet nur, wenn sein Selbsttest in einer Unit mit denselben Grenzen einen eigenen Netz-Namensraum vorfindet (worker.py selbsttest), und jeder Auftrag startet in seiner eigenen Unit hinter einem Vorspann (laeufer.py VORSPANN, python -I -c, erst danach execv nach scanview-import, das pdal und untwine als Kinder im selben Namensraum startet). Der Vorspann wiederholt die Prüfung fail-closed und endet sonst mit Exit 97, bevor ein Werkzeug läuft; der Auftrag scheitert dann mit „Isolation greift nicht“. Geprüft werden /proc/self/net/dev (Namensraum des Lesers) und /sys/class/net: beide gleich, lo vorhanden, sonst nur die Fallback-Tunnel, die der Kernel in jedem neuen Namensraum ohne Gegenstelle und inaktiv anlegt (tunl0, gre0, sit0, ip6tnl0 u. a.; Kernel-Doku net.core.fb_tunnels_only_for_init_net); jeder Lesefehler zählt als offen (laeufer.py NETZRAUM_QUELLE; Gegenproben ohne PrivateNetwork in test_isolation.py: Selbsttest scheitert an netzraum, Vorspann startet das Werkzeug nicht). Nötig, weil systemd PrivateNetwork im User-Manager sonst still weglässt („proceeding without“) und das bei jedem Unit-Start neu entscheidet. Erreichbar ist nur lo, ohne SSH-Server."
zeit = 2026-11-10T10:52:04Z
pruefer = "Claude (Release 0.12.3, Master-Session; je Gruppe zwei unabhängige Prüfer)"

