[[vex]]
schwachstelle = "OSV-2021-777"
paket = "libxml2"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact_statement = "Use-after-free in xmlAddNextSibling beim XInclude-Kopieren (OSS-Fuzz 34461, Absturzpfad xmlXIncludeCopyRange/xmlXIncludeCopyXPointer). OSV führt nur ein introduced-Ereignis, keine behobene Version; xmlXIncludeCopyRange gibt es in libxml2 2.15.4 nicht mehr, xmlXIncludeCopyXPointer schon (xinclude.c Z. 826, Aufruf Z. 1313). Die Aussage stützt sich deshalb auf die Symbolprüfung und darauf, dass XInclude abgeschaltet bleibt, nicht auf den Wegfall der Funktion. XInclude läuft nur über die xmlXInclude*-API oder intern im xmlTextReader (xmlreader.c Z. 1433–1461), und dort nur, wenn XML_PARSE_XINCLUDE an xmlTextReaderSetup übergeben wurde (Z. 4855–4859); der Parser selbst ignoriert die Option (parser.c Z. 13176–13178), andere Aufrufer gibt es in 2.15.4 außerhalb von Tests, Beispielen und xmllint nicht. Kein ELF der Hülle = ldd von bin/pdal, bin/untwine und lib/libpdal_plugin_*.so der installierten Umgebung (70 ELF-Dateien), Importe per nm -D --undefined-only, 10.11.2026 importiert irgendein xmlXInclude*-Symbol (Gegenprobe: libxml2.so.16.1.4 exportiert 13 davon), xmlTextReaderSetup, xmlTextReaderSetParserProp oder xmlReaderNew*. Einziger Reader-Importeur der Hülle ist libarchive (xar-Leser): xmlReaderForIO(..., 0), im Binärcode belegt (xar_read_header: xor %r9d,%r9d an 0x63c6b vor dem Aufruf an 0x63c84). libgdal, libspatialite und libpdalcpp parsen XML nur über xmlReadFile/xmlReadMemory (libspatialite, libpdalcpp) bzw. xmlParseDoc (libgdal) sowie im Schema-Code (xmlSchemaParse, bei libgdal auch xmlSchemaValidateFile); dazu kommen XPath-, Baum- und Speicher-Schreibfunktionen. XInclude rufen in den Bibliotheksquellen von 2.15.4 nur xinclude.c selbst und xmlreader.c auf, Schema-, XPath- und Baumcode nicht. lib/gdalplugins enthält nur drivers.ini. In der Umgebung importiert allein bin/xmllint (aus dem Paket libxml2) XInclude-Symbole, aber xmllint liegt außerhalb der Hülle und wird nie gestartet (pdal_runner startet nur bin/pdal und bin/untwine). Ebenfalls außerhalb der Hülle liegen bin/bsdtar und bin/bsdcpio, die denselben xmlReaderForIO-Weg nutzen. Das Paket libxml2 selbst enthält laut conda-meta nur bin/xmllint und bin/xmlcatalog, beide außerhalb der Hülle; die Bibliothek lib/libxml2.so.16.1.4 gehört zum Paket libxml2-16."
zeit = 2026-11-10T10:52:04Z
pruefer = "Claude (Release 0.12.3, Master-Session; je Gruppe zwei unabhängige Prüfer)"

