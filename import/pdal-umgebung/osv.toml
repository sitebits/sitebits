[[vex]]
schwachstelle = "CVE-2025-67899"
paket = "uriparser"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact_statement = "Unbegrenzte Rekursion/Stapelüberlauf im Parser src/UriParse.c (uriparser 0.9.8; OSV: last_affected 0.9.9, Beispiel ParseMustBeSegmentNzNc mit vielen Kommas). Der Fix PR #284 (ChangeLog 0.9.10) löst alle 13 Fälle direkter und indirekter Rekursion im Parser auf, nicht nur die in ParseMustBeSegmentNzNc (Selbstaufrufe Z. 911/932; Einstiege in ParseMustBeSegmentNzNc aus ParseSegmentNzNcOrScheme2 Z. 1868/1884 und ParseUriReference Z. 1976/1986). Erreichbar sind sie über die Parse-Einstiege (uriParseUriA u. a.). Der Code ist geladen, wird aber nie aufgerufen, deshalb nicht vulnerable_code_not_present: liburiparser kommt nur über die NEEDED-Kette libgdal → libkmlbase → liburiparser in den Prozess. In der Hülle = ldd von bin/pdal, bin/untwine und lib/libpdal_plugin_*.so der installierten Umgebung (70 ELF-Dateien), Importe per nm -D --undefined-only, 10.11.2026 importiert nur libkmlbase uri*-Symbole (uriParseUriA, uriAddBaseUriA, uriNormalizeSyntaxA, uriToStringA, uriToStringCharsRequiredA, uriFreeUriMembersA, uriUnixFilenameToUriStringA, uriUriStringToUnixFilenameA, uriUriStringToWindowsFilenameA, uriWindowsFilenameToUriStringA); libkml-Symbole importieren nur libgdal, libkmldom und libkmlengine. In GDAL 3.13.3 bindet nur ogr/ogrsf_frmts/libkml die libkml-Header ein; dieser Treiber ist fest in libgdal (lib/gdalplugins enthält nur drivers.ini) und wird nur über GDALAllRegister/OGRRegisterAll (ogrregisterall.cpp) registriert. In der Hülle importiert nur libpdalcpp diese Symbole; PDAL 2.10.2 ruft sie nur in gdal::registerDrivers() (GDALUtils.cpp) auf, erreichbar aus readers.gdal/ogr/tindex/stac, filters.colorization/colorinterp/overlay/dem/hag_dem/geomdistance/smrf (Debug-Raster), writers.gdal/ogr/raster und OGRSpec-Optionen (readers.copc/ept, filters.crop) — keine der festen Stufen (readers.e57/las/text/ply/pts, filters.assign/transformation/voxelcenternearestneighbor/ferry/expression, writers.las/copc) enthält GDAL-Öffnungs- oder Registrierungsaufrufe, und die Pipeline-JSON baut pdal_runner mit festen Schlüsseln, sodass eine hochgeladene Datei keine Stufe oder Option ergänzen kann. SRS-Zeichenketten gehen nur an OGRSpatialReference::SetFromUserInput, das höchstens per VSIFOpenL eine Datei liest, keinen Treiber öffnet. Gegenprobe zur Laufzeit (10.11.2026): bin/pdal pipeline mit allen festen Stufen (6 Pipelines, darunter --stream mit readers.e57) und bin/untwine unter gdb mit Haltepunkten auf allen 47 uri*-Exporten von liburiparser sowie GDALAllRegister/OGRRegisterAll/RegisterOGRLIBKML/GDALOpen/GDALOpenEx/OGROpen, je 53 aufgelöst, 0 Treffer; Kontrollen: ogrinfo -if LIBKML trifft die GDAL-Haltepunkte, direkter Aufruf von uriParseSingleUriA trifft die uri*-Haltepunkte. Behoben erst nach 0.9.9; conda-forge führt nur 0.9.8 (api.anaconda.org, 10.11.2026)."
