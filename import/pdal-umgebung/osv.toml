[[vex]]
schwachstelle = "CVE-2025-15661"
paket = "libssh2"
status = "not_affected"
justification = "inline_mitigations_already_exist"
impact_statement = "Heap-Lesefehler über die Puffergrenze in sftp_symlink() (src/sftp.c), ausgelöst durch eine präparierte SSH_FXP_NAME-Antwort des SFTP-Servers bei READLINK/REALPATH, behoben in 2dae302. Einziger libssh2-Importeur in der Hülle = ldd von bin/pdal, bin/untwine und lib/libpdal_plugin_*.so der installierten Umgebung (70 ELF-Dateien; lib/gdalplugins ohne Plugins), Importe per nm -D --undefined-only, 10.11.2026 ist libcurl 8.23.0. Es importiert 63 libssh2-Symbole, darunter libssh2_sftp_symlink_ex. Die Fehlerstelle ist damit erreichbar, und zwar nur in einer SFTP-Sitzung über eine sftp://-URL: curl-config --protocols nennt SCP und SFTP, libssh2 liest die Serverantwort per recv() aus dem Socket, den libcurl nach dem Verbindungsaufbau übergibt. Dass eine fremde Eingabedatei libcurl eine solche URL unterschieben kann, ist nicht ausgeschlossen: Die Stufen bekommen nur lokale Pfade, aber Inhalte wie SRS-Zeichenketten gehen an GDAL, und GDAL /vsicurl/ reicht URLs an libcurl weiter. Deshalb lautet die Begründung nicht vulnerable_code_not_in_execute_path. Abschirmung, gültig für den Import-Worker auf dem Server (scanview-import-worker, von einrichten.sh mit SCANVIEW_IMPORT=1 eingerichtet; der am Arbeitsplatz laufen dieselben Builds im Image scanview-pdal (Gleichheit per test_image_lock_gleiche_builds_wie_pdal_umgebung), dort abgeschirmt durch docker run --network none, gemessen nur lo; diese VEX-Aussage ist formal an pixi.lock gebunden und gibt den Image-Inhalt nicht frei, siehe B-SCAN-IMG-PDAL): pdal und untwine laufen als Kind von scanview-import in der transienten Auftrags-Unit, siehe server/src/scanview_worker/laeufer.py:208 (PrivateNetwork=yes), :211 (RestrictAddressFamilies=AF_INET AF_INET6, also kein AF_UNIX) und :216 (PrivatePIDs=yes). Erzwungen statt angenommen, beim Start und je Auftrag: Der Worker startet nur, wenn sein Selbsttest in einer Unit mit denselben Grenzen einen eigenen Netz-Namensraum vorfindet (worker.py selbsttest), und jeder Auftrag startet in seiner eigenen Unit hinter einem Vorspann (laeufer.py VORSPANN, python -I -c, erst danach execv nach scanview-import, das pdal und untwine als Kinder im selben Namensraum startet). Der Vorspann wiederholt die Prüfung fail-closed und endet sonst mit Exit 97, bevor ein Werkzeug läuft; der Auftrag scheitert dann mit „Isolation greift nicht“. Geprüft werden /proc/self/net/dev (Namensraum des Lesers) und /sys/class/net: beide gleich, lo vorhanden, sonst nur die Fallback-Tunnel, die der Kernel in jedem neuen Namensraum ohne Gegenstelle und inaktiv anlegt (tunl0, gre0, sit0, ip6tnl0 u. a.; Kernel-Doku net.core.fb_tunnels_only_for_init_net); jeder Lesefehler zählt als offen (laeufer.py NETZRAUM_QUELLE; Gegenproben ohne PrivateNetwork in test_isolation.py: Selbsttest scheitert an netzraum, Vorspann startet das Werkzeug nicht). Nötig, weil systemd PrivateNetwork im User-Manager sonst still weglässt („proceeding without“) und das bei jedem Unit-Start neu entscheidet. Im eigenen Netz-Namensraum ist nur lo erreichbar, und dort lauscht kein SSH-Server, weil in der Unit nur die Auftragsprozesse laufen. Der Fix 2dae302 ist in libssh2-1.11.1 (a312b43) nicht enthalten (GitHub compare: behind)."
zeit = 2026-11-10T10:52:04Z
pruefer = "Claude (Release 0.12.3, Master-Session; je Gruppe zwei unabhängige Prüfer)"

