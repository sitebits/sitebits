name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow [SECURITY.md](https://github.com/sitebits/sitebits/blob/main/SECURITY.md) and report confidentially.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version or commit.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic data. Remove credentials and personal or customer data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system and affected component.
    validations:
      required: true
