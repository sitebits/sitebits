name: Feature request
description: Suggest an improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the need without personal or customer data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
