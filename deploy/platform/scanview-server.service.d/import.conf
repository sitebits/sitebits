# Drop-in für scanview-server.service — nur mit SCANVIEW_IMPORT=1 (und eingeschaltetem Jobläufer)
# installiert (einrichten.sh); beim Ausschalten entfernt.
[Service]
# Gruppe nur über die Unit, nicht in /etc/group: ohne Drop-in erreicht der Webdienst die Uploads nicht.
SupplementaryGroups=scanview-upload
# Uploads in Stücken schreiben (außerhalb der ausgelieferten Paketwurzel). Der Webdienst liest
# davon nur Kopfbytes (Signaturprüfung); alles Weitere liest nur der isolierte Auftrag.
ReadWritePaths=/srv/scanview/uploads
Environment=SCANVIEW_UPLOADS=/srv/scanview/uploads
