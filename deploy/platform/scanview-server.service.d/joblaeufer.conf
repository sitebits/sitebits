# Drop-in für scanview-server.service — nur mit eingeschaltetem Jobläufer installiert
# (einrichten.sh, SCANVIEW_JOBLAEUFER=1); beim Ausschalten entfernt. Die Hauptunit bleibt dadurch
# unverändert.
[Service]
# Gruppe nur über die Unit, nicht in /etc/group: ohne Drop-in hat der Webdienst keinen Zugriff.
SupplementaryGroups=scanview-jobs
# SCANVIEW_JOBS_DB und SCANVIEW_BERICHTE (Routen der Auswertungen); ohne sie antworten sie 404.
EnvironmentFile=/etc/scanview/scanview-joblaeufer.env
# jobs.db (+ -wal/-shm) schreiben: Aufträge einreihen, Löschwunsch setzen.
ReadWritePaths=/srv/scanview/jobs
# Berichte nur lesen (Auslieferung mit Projektrechten); schreiben und löschen tut nur der Worker.
ReadOnlyPaths=/srv/scanview/berichte
