# fail2ban-Filter für scanview-server — nach /etc/fail2ban/filter.d/scanview.conf.
# Passt auf die Journal-Zeile aus server/src/scanview_server/passwort.py (fehlversuch_melden):
#   WARNING scanview.anmeldung: scanview Anmeldung fehlgeschlagen (Konto-Schlüssel 3d1517c22ca9) von 203.0.113.12
# Die IP steht nur im Journal (Sicherheitslog), nie in der Datenbank. Kann der Dienst
# keine gültige IP ermitteln, steht dort „unbekannt“ — das passt bewusst nicht (nichts zu sperren).
# Prüfen: fail2ban-regex systemd-journal[journalmatch='_SYSTEMD_UNIT=scanview-server.service'] scanview
# ASCII-Muster („Schl\S+“ statt „Schlüssel“), damit die Kodierung des Journals keine Rolle spielt.

[Definition]
failregex = ^.*scanview Anmeldung fehlgeschlagen \(Konto-Schl\S+ [0-9a-f]+\) von <HOST>$
ignoreregex =
