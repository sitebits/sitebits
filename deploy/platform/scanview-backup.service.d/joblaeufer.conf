# Drop-in für scanview-backup.service — nur mit eingeschaltetem Jobläufer installiert
# (einrichten.sh, SCANVIEW_JOBLAEUFER=1). Ergänzt die tägliche Sicherung um die Auftragsdatenbank
# (7 Stück wie scanview.db) und einen Spiegel der Berichtsablage (ein Stand; gelöschte Berichte
# verschwinden mit dem nächsten Lauf auch aus dem Spiegel — Löschzusage). Ziel wie bisher
# /srv/scanview/state/backups (scanview, 0700), Dateien 0600 dank UMask der Unit.
[Service]
SupplementaryGroups=scanview-jobs
# Lesen einer WAL-Datenbank braucht Schreibzugriff auf -shm im Ordner der Datenbank.
ReadWritePaths=/srv/scanview/jobs
ReadOnlyPaths=/srv/scanview/berichte
# Zweites ExecStart (Type=oneshot): läuft nach der Sicherung von scanview.db.
# rsync -rt ohne -l/-o/-g/-p: nur reguläre Dateien und Ordner, Eigentümer scanview, Rechte aus der
# UMask; Arbeitsordner laufender Aufträge nicht. systemd: %% = %, $$ = $.
ExecStart=/bin/sh -c 'set -eu; d=/srv/scanview/state/backups; mkdir -p "$$d/jobs" "$$d/berichte"; sqlite3 /srv/scanview/jobs/jobs.db ".backup $$d/jobs/$$(date +%%F).db"; ls -1t "$$d"/jobs/*.db | tail -n +8 | xargs -r rm -f --; rsync -rt --delete --exclude ".arbeit-*" /srv/scanview/berichte/ "$$d/berichte/"'
