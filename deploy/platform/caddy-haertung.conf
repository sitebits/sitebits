# Härtung für caddy.service (Debian-Paket) — nach /etc/systemd/system/caddy.service.d/haertung.conf,
# dann `systemctl daemon-reload && systemctl restart caddy` (Neustart, nicht reload: Sandbox-Optionen
# wirken erst beim Start). Die Standard-Unit des Pakets hat laut `systemd-analyze security` die
# Einstufung „EXPOSED“, obwohl Caddy TLS terminiert, Zugangsdaten für die DNS-Validierung halten
# kann und die Admin-API bereitstellt.
#
# Was Caddy braucht und behält:
#  - schreiben nur in /var/lib/caddy (Zertifikate, autosave.json unter $HOME/.local/.config),
#    /var/log/caddy (falls Logdateien) und /run/caddy (Admin-Socket, RuntimeDirectory unten);
#  - lesen: /etc/caddy, /opt/scanview/web, /srv/scanview/data (ProtectSystem=strict = nur lesend);
#  - Netz: Ports 80/443 (CAP_NET_BIND_SERVICE), ausgehend ACME + DNS-01 (API des DNS-Anbieters);
#  - AF_NETLINK: Go fragt darüber Schnittstellen/Adressen ab.
# Nicht übernommen: CAP_NET_ADMIN aus der Paket-Unit (nur für größere UDP-Puffer von HTTP/3 —
# ohne es warnt quic-go einmal, funktioniert aber); IPAddressDeny (ACME/DNS-01 brauchen ausgehend).
# SystemCallErrorNumber=EPERM: ein unerwarteter Systemaufruf scheitert mit Fehler statt Caddy
# per SIGSYS zu beenden (Go-Laufzeit fragt z. B. optionale Aufrufe ab).
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ReadWritePaths=/var/lib/caddy -/var/log/caddy
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE
UMask=0027
