# Drop-in für scanview-import-worker.service — nur mit SCANVIEW_IMPORT=1 installiert (einrichten.sh);
# beim Ausschalten entfernt. Ohne ihn kennt der Worker weder Uploads noch Übergabe (neue Projekte
# scheitern mit „nicht eingerichtet“), die Auswertungen laufen unverändert.
[Service]
# scanview-upload: Uploads nur lesen (Ordner 2750, Dateien 0640 des Webdienstes).
SupplementaryGroups=scanview-upload
# Übergabe: Arbeitsordner der Import-Aufträge und fertige, geprüfte Pakete (Worker schreibt).
ReadWritePaths=/srv/scanview/uebergabe
# Uploads und die Antwort der Übergabe (ein Wort je Paket) nur lesen.
ReadOnlyPaths=/srv/scanview/uploads /srv/scanview/uebergabe-meldungen
Environment=SCANVIEW_UPLOADS=/srv/scanview/uploads
Environment=SCANVIEW_UEBERGABE=/srv/scanview/uebergabe
Environment=SCANVIEW_UEBERGABE_MELDUNGEN=/srv/scanview/uebergabe-meldungen
# Wie in der Hauptunit, dazu die Meldungen: ein Auftrag sieht sie nie (nur der Worker liest sie).
Environment=SCANVIEW_JOBS_UNSICHTBAR=/srv/scanview/state:/srv/scanview/jobs:/srv/scanview/eingang:/etc/scanview:/var/lib/scanview-import:/var/backups/scanview:/var/log/scanview:/srv/scanview/uebergabe-meldungen
