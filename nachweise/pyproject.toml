[project]
name = "scanview-nachweise"
version = "0.12.0"
description = "Freigabekette für Release-Nachweise (SBOM, Scan, Manifest) der scanview-Plattform"
requires-python = ">=3.11"
# Laufzeit bewusst ohne Fremdabhängigkeiten: SBOM/Scan/Manifest-Orchestrierung nutzt nur die
# Standardbibliothek, gehärtete Fremdwerkzeuge laufen als per Digest gepinnte Container.
dependencies = []

[project.scripts]
scanview-nachweise = "scanview_nachweise.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
# Wie server/pyproject.toml: Build-Backend exakt gepinnt (steht nicht im uv.lock), 1.32.3 ist die
# jüngste Version vor dem Stichtag (siehe [tool.uv] exclude-newer unten).
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanview_nachweise"]

[tool.uv]
# Lieferkette wie server/ (Lieferkettenregeln): fester ISO-Stichtag
# statt relativer Angabe, damit die geprüfte Mindestalter-Grenze beim nächsten Relock nicht still
# weiterwandert.
exclude-newer = "2026-09-20T00:00:00Z"
# Kein globales no-build (blockiert unter uv 0.11.3 auch den Bau des eigenen, lokalen Pakets),
# stattdessen alle Fremdpakete aus uv.lock (Dev-Gruppe: pytest, ruff, mypy und ihre Abhängigkeiten;
# `grep '^name = ' uv.lock` ohne scanview-nachweise) plus die Build-Zeit-Abhängigkeiten von
# hatchling 1.32.3, die nicht im Lock stehen (PyPI-Metadaten: packaging, pathspec, pluggy stehen
# schon aus dem Lock drin, neu sind hatchling selbst, tomlkit, trove-classifiers).
no-build-package = [
    "ast-serialize",
    "colorama",
    "hatchling",
    "iniconfig",
    "librt",
    "mypy",
    "mypy-extensions",
    "packaging",
    "pathspec",
    "pluggy",
    "pygments",
    "pytest",
    "ruff",
    "tomlkit",
    "trove-classifiers",
    "typing-extensions",
]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
extend-select = ["BLE", "C90", "ASYNC"]

[tool.mypy]
exclude = ["^werkzeuge/"]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
pythonpath = ["tests"]
# Nur die eigenen Tests: unter werkzeuge/*/site*/ liegen die installierten SBOM-Werkzeuge samt
# ihren Paket-Tests (werkzeuge_bereitstellen).
testpaths = ["tests"]
markers = [
    "docker: Integrationstest mit echtem Container (gepinntes Image lokal vorhanden)",
]

[tool.ruff.lint.mccabe]
max-complexity = 15
