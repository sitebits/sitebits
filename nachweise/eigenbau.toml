# Fremdkomponenten, die scanview aus gepinnter Quelle selbst baut und im Repo mitliefert.
# Kein Paketmanager belegt sie; die Kette prüft die SHA-256 jeder Datei gegen den Worktree und trägt
# die Komponente mit Quelle/Commit, Toolchain-Digest und Bau-Skript in die SBOM ein (fail-closed).
# Neu bauen: Bau-Skript (`bau`) ausführen; ändern sich Dateien, hier die SHA-256 nachziehen.
# Entscheidung: ADR 2026-10-07-scanview-basis-transcoder-eigenbau (Vault Ops/security/decisions/).

[[komponente]]
artefakt = "web"
name = "basis-universal-transcoder"
version = "1.50.0"
quelle = "https://github.com/BinomialLLC/basis_universal"
commit = "051ad6d8a64bb95a79e8601c317055fd1782ad3e"
tag = "v1_50_0"
werkzeug = "emscripten/emsdk@sha256:2e5a1ae55cc0ef2d0c5d5c87deb4a74bea15c6ae03b2333d8aca02516671345b"
bau = "web/vendor/basis/bauen.sh"
lizenz = "Apache-2.0 AND BSD-3-Clause"
lizenzbeleg = "web/licenses/zstd-BSD-3-Clause.txt"
grund = "Upstream-Build erzeugt embind-Aufrufer per Function(); unter der CSP ohne 'unsafe-eval' fehlten Mesh-Texturen still. Eigenbau mit -sDYNAMIC_EXECUTION=0 und dem zstd-Decoder 1.5.7 statt des mitgelieferten 1.4.9, bitgleich reproduzierbar"
adr = "2026-10-07-scanview-basis-transcoder-eigenbau"

# Mitgebaute Bibliothek; eigene Quelle + Commit, damit die OSV-Ersatzprüfung sie abfragen kann
# (trivy kennt keinen selbst gebauten C-Code). basis_universal v1_50_0 liefert zstd 1.4.9 mit
# (OSV-2022-15 per Tag); bauen.sh ersetzt den Decoder durch zstd 1.5.7 aus eigenem Checkout.
# Commit = Tag v1.5.7 (Tag-Objekt ac66b19e…, Ziel f8745da6…).
[[komponente.enthalten]]
name = "zstd"
version = "1.5.7"
quelle = "https://github.com/facebook/zstd"
commit = "f8745da6ff1ad1e7bab384bd1f9d742439278e99"
tag = "v1.5.7"
lizenz = "BSD-3-Clause"
teil = "nur der Decoder: zstd/zstddeclib.c, von bauen.sh mit build/single_file_libs/combine.py aus zstd v1.5.7 erzeugt und samt zstd.h/zstd_errors.h im Quellbaum von basis_universal ersetzt (dort 1.4.9), keine Kompression"

[[komponente.datei]]
pfad = "web/vendor/basis/basis_transcoder.js"
sha256 = "6f2a04342d3c17c740859938ea678ece979b30ccc2ef89e9879b6af0619b25c1"

[[komponente.datei]]
pfad = "web/vendor/basis/basis_transcoder.wasm"
sha256 = "23cbe1a04eb8cdda925df80e19ee3dd6ab7a9ffa57afa5dcd183a9a3b402e01a"
