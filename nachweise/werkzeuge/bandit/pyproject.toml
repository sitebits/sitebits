# Werkzeugordner für bandit (Nachweiskette, docs/compliance/werkzeuge.md „Teil 4“). Kein eigenes
# Paket: nur die exakt gepinnte Werkzeugversion samt Abhängigkeiten aus uv.lock, installiert im
# gepinnten uv-Image (werkzeuge.json) als protokollierter Netzschritt.
[project]
name = "scanview-werkzeug-bandit"
version = "0"
requires-python = "==3.11.*"
dependencies = ["bandit==1.9.4"]

[tool.uv]
package = false
# Lieferkette wie server/: nur Pakete, die am Probe-Tag (2026-09-28) mindestens 7 Tage öffentlich
# waren — fester ISO-Stichtag, damit ein späterer Relock nicht still weiterwandert.
exclude-newer = "2026-09-21T00:00:00Z"
# Nie sdists fremder Pakete bauen: jedes Paket aus uv.lock steht hier (drift-getestet).
no-build-package = [
    "bandit",
    "colorama",
    "markdown-it-py",
    "mdurl",
    "pygments",
    "pyyaml",
    "rich",
    "stevedore",
]
